[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# config.js carries the Apps Script endpoint and changes independently of a
# rebuild, so it must never be served stale.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
